name: Bug report
description: Something in Spektra does not work as it should.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: instrument
    attributes:
      label: Instrument
      description: Model and serial number prefix, or "simulated (?mock)".
      placeholder: HDX
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Browser and operating system
      placeholder: Chrome 131 on Windows 11
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Messages
      description: The message Spektra showed, and any errors in the browser console (F12 → Console).
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, an exported CSV, or steps that make it happen again.
